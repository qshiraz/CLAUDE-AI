# Sahil Configuration
# Copy this file to config.local.yaml and fill in your API keys.
# config.local.yaml is gitignored — never commit real keys.

jarvis:
  name: "Sahil"
  version: "1.0.0"
  user_name: "Boss"
  # Location settings used across weather, traffic, flights
  location:
    city: "Mombasa"
    country: "KE"
    latitude: -4.0435
    longitude: 39.6682
    timezone: "Africa/Nairobi"
    iata_airport: "MBA"   # Moi International Airport

claude:
  model: "claude-sonnet-4-6"
  streaming: true

# ── Agent API keys ──────────────────────────────────────────
weather:
  enabled: true
  api_key: "YOUR_OPENWEATHERMAP_API_KEY"
  # Free tier: https://openweathermap.org/api
  units: "metric"

news:
  enabled: true
  api_key: "YOUR_NEWSAPI_KEY"
  # Free tier: https://newsapi.org/
  country: "ke"
  page_size: 10

email:
  enabled: true
  provider: "gmail"   # gmail | imap
  # For Gmail: create an App Password at myaccount.google.com/apppasswords
  address: "your@gmail.com"
  password: "YOUR_APP_PASSWORD"
  imap_host: "imap.gmail.com"
  imap_port: 993
  max_emails: 10

smart_home:
  enabled: true
  provider: "home_assistant"  # home_assistant | mqtt
  # Home Assistant: Settings → Profile → Long-lived access tokens
  ha_url: "http://homeassistant.local:8123"
  ha_token: "YOUR_HOME_ASSISTANT_TOKEN"

flights:
  enabled: true
  api_key: "YOUR_AVIATIONSTACK_API_KEY"
  # Free tier: https://aviationstack.com/
  radius_km: 150

traffic:
  enabled: true
  provider: "tomtom"   # tomtom | googlemaps
  api_key: "YOUR_TOMTOM_API_KEY"
  # Free tier: https://developer.tomtom.com/
  radius_km: 30

education:
  enabled: true

# ── Guard Vision (Hikvision cloud) ──────────────────────────
guard_vision:
  enabled: true
  app_key: ""
  app_secret: ""

# ── Hik-Connect direct login (uses Guard Vision app credentials) ─────────────
hik_connect:
  enabled: true
  username: "your_guardvision_email_or_phone"
  password: "YOUR_GUARDVISION_PASSWORD"

# ── Guard Vision Share QR (easiest — scan your share QR code) ───────────────
# Scan your Guard Vision share QR → text looks like:
# HC_DEVICE_GROUP_SHARE:{"qrId":"abc123...","isEncrypt":false}
# Copy just the qrId value below
guard_vision_share:
  enabled: true
  qr_id: "YOUR_QR_ID_HERE"

# ── Guard Vision browser automation (no API key needed) ──────────────────────
# Uses Playwright to log into web.hik-connect.com and capture screenshots
# Install once: pip install playwright && playwright install chromium
guard_vision_browser:
  enabled: true
  username: "your_guardvision_email"
  password: "YOUR_GUARDVISION_PASSWORD"

# ── Camera / Guard Vision ────────────────────────────────────
# Add your Guard Vision / IP cameras here (or in config.local.yaml)
camera:
  enabled: true
  snapshot_dir: "/tmp/jarvis_snapshots"
  cameras: []
  # Example camera entries (add to config.local.yaml with real values):
  # cameras:
  #   - id: "front_gate"
  #     name: "Front Gate"
  #     location: "Main Entrance"
  #     url: "rtsp://192.168.1.100:554/stream1"
  #     username: "admin"
  #     password: "YOUR_CAMERA_PASSWORD"
  #   - id: "backyard"
  #     name: "Backyard"
  #     location: "Rear Garden"
  #     url: "http://192.168.1.101/snapshot.jpg"
  #     username: "admin"
  #     password: "YOUR_CAMERA_PASSWORD"

radio:
  enabled: true

sports:
  enabled: true

# ── Tuya Smart Home ─────────────────────────────────────────
# Get credentials: https://platform.tuya.com → Cloud → Create project
# Then link your Tuya Smart / Smart Life app account under "Linked Devices"
tuya:
  enabled: true
  access_id: "YOUR_TUYA_ACCESS_ID"
  access_secret: "YOUR_TUYA_ACCESS_SECRET"
  # Pick the data-center closest to you:
  #   openapi.tuyaeu.com  — Europe & Africa  (recommended for Kenya)
  #   openapi.tuyaus.com  — Americas
  #   openapi.tuyacn.com  — China
  #   openapi.tuyain.com  — India
  base_url: "https://openapi.tuyaeu.com"
  home_id: ""   # optional — leave blank to list all homes' devices

# ── Plugin directory ────────────────────────────────────────
plugins:
  enabled: true
  directory: "jarvis/plugins"
  autoload: true
